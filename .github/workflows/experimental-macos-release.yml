name: Experimental macOS Release

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish-macos:
    name: Publish macOS release
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust toolchain
        shell: bash
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi

          export PATH="$HOME/.cargo/bin:$PATH"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Install frontend dependencies
        run: npm ci

      - name: Build and publish experimental macOS Apple Silicon release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: experimental-macos-v__VERSION__-run-${{ github.run_id }}-${{ github.run_attempt }}
          releaseName: EXPERIMENTAL macOS build v__VERSION__ (run ${{ github.run_number }}.${{ github.run_attempt }})
          releaseBody: |
            Experimental GitHub Actions macOS build for FRK PDF Manager.

            This release is intentionally labeled EXPERIMENTAL and may be unsigned or otherwise unsuitable for general distribution.

            Commit: ${{ github.sha }}
            Triggered from: ${{ github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          prerelease: true
          args: --target aarch64-apple-darwin --bundles app,dmg
          assetNamePattern: experimental-[name]-[version]-[platform]-[arch]-[bundle][ext]

      - name: Build and publish experimental macOS Intel release
        uses: tauri-apps/tauri-action@v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: experimental-macos-v__VERSION__-run-${{ github.run_id }}-${{ github.run_attempt }}
          releaseName: EXPERIMENTAL macOS build v__VERSION__ (run ${{ github.run_number }}.${{ github.run_attempt }})
          releaseBody: |
            Experimental GitHub Actions macOS build for FRK PDF Manager.

            This release is intentionally labeled EXPERIMENTAL and may be unsigned or otherwise unsuitable for general distribution.

            Commit: ${{ github.sha }}
            Triggered from: ${{ github.ref_name }}
          releaseCommitish: ${{ github.sha }}
          prerelease: true
          args: --target x86_64-apple-darwin --bundles app,dmg
          assetNamePattern: experimental-[name]-[version]-[platform]-[arch]-[bundle][ext]
